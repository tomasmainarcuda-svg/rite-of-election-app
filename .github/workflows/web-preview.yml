# Builds the WEB version of the app (same Dart code) and publishes it on GitHub Pages,
# every time the code changes. Link: https://<user>.github.io/<repo>/
# Publishes by pushing the built site to the "gh-pages" branch (Settings → Pages →
# Deploy from a branch → gh-pages). The newer "deploy-pages" action kept hanging (Nov 4).
name: Web preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # The project only has lib/ and assets/: create the missing web/ folder (does not touch lib/).
      - run: flutter create --platforms=web --project-name rite_of_election .
      - run: flutter pub get
      # STAFF app (separate app, own link: /<repo>/staff/) — built first and set aside.
      - run: flutter build web --release -t lib/main_staff.dart --base-href "/${{ github.event.repository.name }}/staff/"
      - run: |
          sed -i 's|<title>.*</title>|<title>Staff · Llamado a fotos</title>|' build/web/index.html
          mv build/web /tmp/staff_web
      # PARTICIPANTS' app (main link).
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - run: cp -r /tmp/staff_web build/web/staff
      - name: Publish to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          force_orphan: true
